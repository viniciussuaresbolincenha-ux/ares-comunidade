<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord</title>

<style>
:root {
  --bg: #313338;
  --side: #1e1f22;
  --panel: #2b2d31;
  --accent: #5865f2;
  --text: #f2f3f5;
  --muted: #b5bac1;
  --line: #3f4147;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px system-ui, Arial, sans-serif;
  height: 100vh;
}

button, input {
  font: inherit;
}

button {
  border: 0;
  border-radius: 6px;
  padding: 10px 13px;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-weight: 600;
}

button:hover {
  filter: brightness(1.1);
}

input {
  background: #1e1f22;
  color: var(--text);
  border: 1px solid #44464d;
  border-radius: 6px;
  padding: 11px;
  width: 100%;
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

#status {
  padding: 9px 14px;
  background: #202127;
  color: #d9dcff;
  font-size: 13px;
}

#login {
  max-width: 440px;
  margin: 10vh auto;
  padding: 28px;
  background: var(--panel);
  border-radius: 12px;
  box-shadow: 0 8px 30px #0003;
}

#login h1 {
  margin-top: 0;
  font-size: 32px;
}

#login p {
  color: var(--muted);
  line-height: 1.5;
}

.row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#app {
  display: none;
  height: calc(100vh - 38px);
  grid-template-columns: 72px 245px minmax(0, 1fr);
}

.rail {
  background: var(--side);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  overflow: auto;
}

.rail button {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  padding: 0;
  font-size: 20px;
  background: #35373c;
}

.rail button.active {
  background: var(--accent);
  border-radius: 14px;
}

.servers {
  background: #2b2d31;
  padding: 16px 12px;
  overflow: auto;
}

.brand {
  font-weight: 800;
  font-size: 19px;
  padding: 5px 8px 16px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}

.section {
  font-size: 11px;
  color: var(--muted);
  font-weight: 800;
  letter-spacing: .07em;
  margin: 18px 8px 8px;
}

.serveritem {
  width: 100%;
  text-align: left;
  background: transparent;
  color: var(--muted);
  margin: 3px 0;
  padding: 10px;
}

.serveritem:hover,
.serveritem.active {
  background: #3b3d44;
  color: white;
}

.main {
  display: flex;
  min-width: 0;
  flex-direction: column;
}

.top {
  height: 56px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-weight: 700;
}

#messages {
  flex: 1;
  overflow: auto;
  padding: 20px;
}

.welcome {
  color: var(--muted);
  margin-top: 25vh;
  text-align: center;
}

.msg {
  margin: 0 0 16px;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.msg strong {
  display: block;
  margin-bottom: 3px;
}

.msg small {
  color: var(--muted);
  font-size: 11px;
  margin-left: 8px;
  font-weight: 400;
}

.composer {
  display: flex;
  gap: 10px;
  padding: 0 20px 20px;
}

.composer input {
  flex: 1;
}

.empty {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  padding: 8px;
}

@media (max-width: 650px) {
  #app {
    grid-template-columns: 58px 150px minmax(0, 1fr);
  }

  .rail {
    padding: 8px 5px;
  }

  .rail button {
    width: 42px;
    height: 42px;
  }

  .servers {
    padding: 10px 6px;
  }

  .top {
    padding: 0 10px;
  }

  #messages {
    padding: 12px;
  }

  .composer {
    padding: 0 10px 12px;
  }

  .brand {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div id="status">Concord • iniciando...</div>

<section id="login">
  <h1>Concord</h1>

  <p>
    Entre com um nome para conversar e criar seus próprios servidores.
  </p>

  <label for="nickname">Seu nome</label>

  <div class="row">
    <input id="nickname" maxlength="24" placeholder="Seu nome">
    <button id="enter">Entrar</button>
  </div>

  <p id="loginError" role="alert"></p>
</section>

<div id="app">

  <aside class="rail">
    <button title="Início" class="active">C</button>
    <button title="Adicionar servidor" id="quickAdd">＋</button>
  </aside>

  <aside class="servers">

    <div class="brand">Concord</div>

    <button id="createServer" style="width:100%">
      ＋ Criar servidor
    </button>

    <div class="section">SEUS SERVIDORES</div>

    <div id="serverList" class="empty">
      Carregando servidores...
    </div>

    <div class="section">CONTA</div>

    <div id="account" class="empty"></div>

    <button id="logout"
      style="width:100%;background:#41434a;margin-top:8px">
      Sair
    </button>

  </aside>

  <main class="main">

    <header class="top">
      <span id="roomTitle"># geral</span>
    </header>

    <div id="messages">
      <div class="welcome">
        <h2>Bem-vindo ao Concord</h2>
        <p>Crie um servidor para começar a conversar.</p>
      </div>
    </div>

    <form id="composer" class="composer">
      <input
        id="messageInput"
        maxlength="1500"
        placeholder="Envie uma mensagem..."
        autocomplete="off"
      >
      <button type="submit">Enviar</button>
    </form>

  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
/* CONFIGURAÇÃO DO FIREBASE */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBO4WNtRV9eSxIazsggYOvE_BTPIi-_NpU",
  authDomain: "concord-5e522.firebaseapp.com",
  projectId: "concord-5e522",
  storageBucket: "concord-5e522.firebasestorage.app",
  messagingSenderId: "98843636750",
  appId: "1:98843636750:web:2c8298a235c5396db3f85f"
};

const $ = id => document.getElementById(id);

let auth;
let db;
let currentUser = null;
let nickname = "";
let currentServer = null;
let unsubscribeMessages = null;
let unsubscribeServers = null;

function status(text) {
  $("status").textContent = "Concord • " + text;
}

function showError(text) {
  $("loginError").textContent = text;
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function configReady() {
  return FIREBASE_CONFIG.apiKey &&
    !FIREBASE_CONFIG.apiKey.includes("COLE_AQUI");
}

try {
  if (!configReady()) {
    status("falta configurar a API Key do Firebase");

    showError(
      "Configure a apiKey do Firebase no início do arquivo index.html."
    );
  } else {
    firebase.initializeApp(FIREBASE_CONFIG);

    auth = firebase.auth();
    db = firebase.firestore();

    status("conectando ao Firebase...");

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        status("conectado");
      }
    });
  }
} catch (error) {
  status("erro ao iniciar");
  showError(error.message);
}

/* ENTRAR */

$("enter").onclick = async () => {
  nickname = $("nickname").value.trim();

  if (!nickname) {
    showError("Digite seu nome.");
    return;
  }

  if (!configReady() || !auth || !db) {
    showError(
      "Firebase não configurado. Confira a apiKey no código."
    );
    return;
  }

  try {
    const credential = auth.currentUser
      ? { user: auth.currentUser }
      : await auth.signInAnonymously();

    currentUser = credential.user;

    await db.collection("users")
      .doc(currentUser.uid)
      .set({
        nickname: nickname,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

    $("login").style.display = "none";
    $("app").style.display = "grid";
    $("account").textContent = nickname;

    status("conectado como " + nickname);

    loadServers();

  } catch (error) {
    showError("Não foi possível entrar: " + error.message);
    status("erro de autenticação");
  }
};

$("nickname").addEventListener("keydown", event => {
  if (event.key === "Enter") {
    $("enter").click();
  }
});

/* LISTAR SERVIDORES */

function loadServers() {
  if (unsubscribeServers) {
    unsubscribeServers();
  }

  unsubscribeServers = db.collection("servers")
    .orderBy("createdAt", "desc")
    .onSnapshot(snapshot => {

      const box = $("serverList");
      box.innerHTML = "";

      if (snapshot.empty) {
        box.innerHTML =
          '<div class="empty">Nenhum servidor ainda. Clique em “Criar servidor”.</div>';
        return;
      }

      snapshot.forEach(document => {
        const data = document.data();
        const button = document.createElement("button");

        button.className = "serveritem";
        button.textContent = "◉ " + (data.name || "Servidor");

        button.onclick = () => {
          selectServer(document.id, data.name || "Servidor");
        };

        box.appendChild(button);
      });

      if (!currentServer && !snapshot.empty) {
        const first = snapshot.docs[0];

        selectServer(
          first.id,
          first.data().name || "Servidor"
        );
      }

    }, error => {
      status("erro ao carregar servidores");
      $("serverList").textContent = "Erro: " + error.message;
    });
}

/* CRIAR SERVIDOR */

async function createServer() {
  if (!currentUser) return;

  const name = prompt("Qual será o nome do servidor?");

  if (!name || !name.trim()) return;

  try {
    const reference = await db.collection("servers").add({
      name: name.trim().slice(0, 50),
      ownerId: currentUser.uid,
      ownerName: nickname,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await reference.collection("channels").doc("general").set({
      name: "geral",
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    selectServer(reference.id, name.trim());

  } catch (error) {
    alert("Erro ao criar servidor: " + error.message);
  }
}

$("createServer").onclick = createServer;
$("quickAdd").onclick = createServer;

/* ABRIR SERVIDOR E MENSAGENS */

function selectServer(id, name) {
  currentServer = id;

  $("roomTitle").textContent = name + " / # geral";

  document.querySelectorAll(".serveritem").forEach(button => {
    button.classList.toggle(
      "active",
      button.textContent === "◉ " + name
    );
  });

  if (unsubscribeMessages) {
    unsubscribeMessages();
  }

  $("messages").innerHTML =
    '<div class="empty">Carregando mensagens...</div>';

  unsubscribeMessages = db.collection("servers")
    .doc(id)
    .collection("messages")
    .orderBy("createdAt", "asc")
    .limit(100)
    .onSnapshot(snapshot => {

      const box = $("messages");
      box.innerHTML = "";

      if (snapshot.empty) {
        box.innerHTML =
          '<div class="welcome"><h2>Canal # geral</h2><p>Envie a primeira mensagem.</p></div>';
        return;
      }

      snapshot.forEach(document => {
        const message = document.data();
        const element = document.createElement("div");

        element.className = "msg";

        const date =
          message.createdAt && message.createdAt.toDate
            ? message.createdAt.toDate().toLocaleString("pt-BR")
            : "agora";

        element.innerHTML =
          "<strong>" +
          escapeHtml(message.nickname || "Usuário") +
          " <small>" + escapeHtml(date) + "</small></strong>" +
          escapeHtml(message.text || "");

        box.appendChild(element);
      });

      box.scrollTop = box.scrollHeight;

    }, error => {
      $("messages").textContent =
        "Erro ao carregar mensagens: " + error.message;
    });
}

/* ENVIAR MENSAGEM */

$("composer").onsubmit = async event => {
  event.preventDefault();

  const text = $("messageInput").value.trim();

  if (!text || !currentServer || !currentUser) return;

  $("messageInput").value = "";

  try {
    await db.collection("servers")
      .doc(currentServer)
      .collection("messages")
      .add({
        text: text,
        nickname: nickname,
        uid: currentUser.uid,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

  } catch (error) {
    alert("Erro ao enviar mensagem: " + error.message);
    $("messageInput").value = text;
  }
};

/* SAIR */

$("logout").onclick = async () => {
  if (unsubscribeMessages) unsubscribeMessages();
  if (unsubscribeServers) unsubscribeServers();

  await auth.signOut();

  currentUser = null;
  currentServer = null;

  $("app").style.display = "none";
  $("login").style.display = "block";

  status("desconectado");
};
</script>

</body>
</html>
